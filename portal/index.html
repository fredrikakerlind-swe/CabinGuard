<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CabinGuard portal · Mockup</title>
<meta name="theme-color" content="#121212">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#121212;--ink2:#1C1C1A;--cream:#F4F2EC;--paper:#FBFAF6;--orange:#FF4E00;--oink:#C23B00;--peach:#FFE4D6;--muted:#6B665D;--line:#E4DED2;--ok:#3F9C6D;--warn:#D99A00;--alert:#FF4E00;--off:#9A958B}
*{box-sizing:border-box}
body{margin:0;font-family:'Geist',Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono','Courier New',monospace}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
/* sidebar */
aside.side{background:var(--ink);color:#D8D3C8;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;color:var(--cream);font-weight:700;font-size:18px;padding:0 8px 22px}
.logo small{display:block;font-family:'Geist Mono',monospace;font-weight:400;font-size:10px;letter-spacing:2px;color:#8E897F;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#BDB7AC;text-decoration:none;font-weight:500;cursor:pointer}
.nav a svg{width:18px;height:18px}
.nav a:hover{background:#1F1F1C;color:#fff}
.nav a.on{background:#2A1A12;color:var(--orange)}
.nav .cnt{margin-left:auto;background:var(--orange);color:var(--ink);font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
.side .cust{margin-top:auto;border-top:1px solid #2A2925;padding:16px 8px 0;display:flex;gap:12px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--orange);color:var(--ink);display:grid;place-items:center;font-weight:700}
.cust b{display:block;color:var(--cream);font-size:14px}.cust span{font-size:12px;color:#8E897F}
/* main */
main{padding:26px 34px 60px;min-width:0}
.top{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.top h1{font-size:28px;letter-spacing:-.6px;margin:0}
.top .sub{color:var(--muted);font-size:14px}
.mock{margin-left:auto;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;background:var(--peach);color:var(--oink);padding:6px 10px;border-radius:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);width:240px}
/* alert banner */
.banner{display:flex;gap:18px;align-items:center;background:var(--ink);color:var(--cream);border-radius:16px;padding:16px 20px;margin-bottom:22px;border-left:6px solid var(--alert);cursor:pointer}
.banner .pulse{width:12px;height:12px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 0 rgba(255,78,0,.6);animation:pulse 1.8s infinite;flex-shrink:0}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,78,0,0)}100%{box-shadow:0 0 0 0 rgba(255,78,0,0)}}
.banner b{font-size:16px}.banner p{margin:2px 0 0;color:#BDB7AC;font-size:14px}
.banner .go{margin-left:auto;background:var(--orange);color:var(--ink);font-weight:600;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font:600 14px Geist,Arial}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi span{font-size:13px;color:var(--muted)}.kpi b{display:block;font-size:30px;letter-spacing:-1px;margin-top:4px}
.kpi.a b{color:var(--alert)}.kpi.w b{color:var(--warn)}
/* layout */
.grid2{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.eyebrow{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.map{position:relative;height:420px;border-radius:12px;background:#EFEBE2;overflow:hidden}
.map svg.se{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;display:flex;align-items:center;gap:6px}
.pin i{width:16px;height:16px;border-radius:50%;border:3px solid var(--paper);background:var(--c);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin.alert i{animation:pulse 1.8s infinite}
.pin span{background:var(--paper);border:1px solid var(--line);font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap}
.attn{display:flex;flex-direction:column;gap:10px}
.at{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#F6F2EA;border-left:5px solid var(--c);cursor:pointer}
.at:hover{background:#EFEADF}
.at .ai{font-size:20px}
.at b{display:block;font-size:14px}
.at span{font-size:13px;color:var(--muted)}
.at small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
/* sites */
.sites{display:grid;grid-template-columns:1fr;gap:16px}
.site{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.site .sh{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.site .ic{width:40px;height:40px;border-radius:12px;background:var(--peach);display:grid;place-items:center;font-size:20px}
.site .sh b{display:block;font-size:16px}.site .sh small{color:var(--muted);font-size:13px}
.st{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;display:inline-flex;width:fit-content;align-items:center;gap:6px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.ok{background:#E3F1E9;color:#2E7A53}.st.warn{background:#FBF0D3;color:#8A6200}.st.alert{background:#FFE4D6;color:var(--oink)}
.room{display:grid;grid-template-columns:1fr 110px 90px 120px;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.room:last-child{border-bottom:0}
.room:hover{background:#F6F2EA}
.room .rn{display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--c)}
.room .rn b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .rn small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .v{font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.room .v small{display:block;font-size:11px;color:var(--muted)}
.spark{width:120px;height:30px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(18,18,18,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--cream);z-index:41;transform:translateX(100%);transition:transform .3s ease;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.dh{background:var(--ink);color:var(--cream);padding:22px 26px}
.dh .x{float:right;background:none;border:1px solid #3A3833;color:var(--cream);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px}
.dh small{color:#8E897F}.dh h3{font-size:24px;margin:6px 0 10px;letter-spacing:-.5px}
.verdict{margin:18px 26px 0;border-radius:14px;padding:16px 18px;background:var(--paper);border-left:6px solid var(--c);display:flex;gap:14px;align-items:center}
.verdict .vi{font-size:28px}.verdict b{display:block;font-size:18px;color:var(--c)}.verdict p{margin:2px 0 0;color:var(--muted);font-size:14px}
.dbody{padding:18px 26px 30px;display:flex;flex-direction:column;gap:16px}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.met{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.met span{font-size:12px;color:var(--muted)}.met b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px}
.tabs button{font:500 13px Geist,Arial;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chart{width:100%;height:170px;display:block}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:78px 18px 1fr;gap:10px;padding:8px 0}
.ev time{font-family:'Geist Mono',monospace;font-size:12px;color:var(--muted);padding-top:2px}
.ev i{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px;position:relative}
.ev b{font-size:14px;display:block}.ev span{font-size:13px;color:var(--muted)}
.baseline{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted)}
.baseline b{color:var(--ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 14px Geist,Arial;border-radius:10px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.p{background:var(--orange);border-color:var(--orange)}
.btn.d{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:12px;font-size:14px;transition:all .3s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.filter{display:flex;gap:6px;margin-bottom:14px}
.filter button{font:500 13px Geist,Arial;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.filter button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
@media (max-width:1180px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.app{grid-template-columns:1fr}aside.side{display:none}.sites{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.search{display:none}main{padding:18px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="logo"><svg width="30" height="30" viewBox="0 0 34 34"><rect width="34" height="34" rx="6" fill="#FF4E00"/><path d="M8 18 17 9.5 26 18v7.5H8z" fill="#121212"/><path d="M14 25.5v-5h6v5" fill="#FF4E00"/></svg><div>CabinGuard<small>by Haysquare</small></div></div>
 <nav class="nav">
  <a class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Overview</a>
  <a onclick="openFirstAlert()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>Alerts<span class="cnt" id="navAlerts">1</span></a>
  <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Sites</a>
  <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
  <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Contacts</a>
  <a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Settings</a>
 </nav>
 <div class="cust"><div class="av">NF</div><div><b>Nordviken Fastigheter</b><span>Fictional customer</span></div></div>
</aside>
<main>
 <div class="top"><div><h1>Good morning, Anna</h1><div class="sub" id="today"></div></div><div class="search">⌕ Search sites and rooms</div><span class="mock">Mockup · fictional data</span></div>
 <div class="banner" id="banner" onclick="openFirstAlert()"><div class="pulse"></div><div><b id="bTitle"></b><p id="bText"></p></div><button class="go">View room</button></div>
 <div class="kpis" id="kpis"></div>
 <div class="grid2">
  <div class="card"><h2><span class="eyebrow">Needs attention</span></h2><div id="attn" class="attn"></div>
   <h2 style="margin-top:22px"><span class="eyebrow">Recent activity</span></h2><div id="recent" class="tl"></div></div>
  <div><div class="filter" id="filter"><button class="on" data-f="all">All rooms</button><button data-f="issues">Needs attention</button><button data-f="cabin">Holiday homes</button><button data-f="business">Business sites</button></div><div class="sites" id="sites"></div></div>
 </div>
</main>
</div>
<div class="scrim" id="scrim" onclick="closeD()"></div>
<div class="drawer" id="drawer" aria-hidden="true"></div>
<div class="toast" id="toast"></div>
<script>
const C={ok:'#3F9C6D',warn:'#D99A00',alert:'#FF4E00',off:'#9A958B'};
const SITES=[
 {id:'sjob',name:'Restaurant Sjöboden',place:'Stockholm',type:'business',ic:'🍽️',x:63,y:74,rooms:[
  {id:'frz',name:'Freezer room',kind:'freezer',status:'alert',temp:-11.8,target:'≤ −18 °C',hum:72,dev:96,batt:91,sig:4,last:'Compressor sound stopped 03:12',sound:'Quiet: compressor not heard',
   ev:[['06:41','alert','Temperature above limit','−11.8 °C, rising 1.1 °C per hour'],['03:14','alert','Alarm sent','To Anna Berg and the duty phone'],['03:12','warn','Compressor sound stopped','“Hum” no longer heard; deviation 96 %'],['03:09','warn','Power dip','Short interruption seen on the meter'],['Yesterday','ok','Daily check','All normal']]},
  {id:'cold',name:'Cold room',kind:'cold',status:'ok',temp:3.4,target:'2 to 5 °C',hum:81,dev:8,batt:93,sig:4,last:'Normal compressor cycles',sound:'Compressor cycling as usual',ev:[['06:00','ok','Daily check','All normal'],['Mon','ok','Defrost cycle','Detected and expected']]},
  {id:'kit',name:'Kitchen',kind:'room',status:'ok',temp:19.6,target:'Info',hum:48,dev:12,batt:88,sig:4,last:'Closed, quiet',sound:'Fans and fridges as usual',ev:[['Yesterday','ok','Closing','Activity ended']]}]},
 {id:'are',name:'Mountain cabin Åre',place:'Åre, Jämtland',type:'cabin',ic:'🏔️',x:30,y:44,rooms:[
  {id:'main',name:'Main room',kind:'room',status:'ok',temp:8.1,target:'Frost guard 8 °C',hum:44,dev:5,batt:84,sig:2,last:'Empty, heating on',sound:'Quiet',ev:[['05:00','ok','Daily check','All normal'],['Sun 16:20','ok','Owner left','Away mode on']]},
  {id:'tech',name:'Technical room',kind:'tech',status:'warn',temp:5.2,target:'≥ 5 °C',hum:58,dev:52,batt:79,sig:2,last:'Heat pump running unevenly',sound:'Heat pump sounds different',ev:[['04:30','warn','Unusual heat pump sound','Deviation 52 % for 40 min'],['04:30','warn','Temperature close to limit','5.2 °C'],['Sun','ok','Normal state updated','Winter profile']]}]},
 {id:'vadd',name:'Summer house Väddö',place:'Norrtälje',type:'cabin',ic:'🏡',x:66,y:70,rooms:[
  {id:'liv',name:'Living room',kind:'room',status:'ok',temp:6.4,target:'Frost guard 5 °C',hum:63,dev:9,batt:96,sig:3,last:'Empty since October',sound:'Quiet; wind outside',ev:[['05:00','ok','Daily check','All normal'],['Fri','ok','Storm','Wind and rain heard; no action']]},
  {id:'util',name:'Utility room',kind:'water',status:'ok',temp:5.9,target:'Frost guard 5 °C',hum:66,dev:6,batt:95,sig:3,last:'Water pump idle',sound:'No running water',ev:[['05:00','ok','Daily check','All normal']]}]},
 {id:'solna',name:'Property Solna 12',place:'Solna',type:'business',ic:'🏢',x:61,y:76,rooms:[
  {id:'fan',name:'Fan room',kind:'fan',status:'warn',temp:21.3,target:'Info',hum:35,dev:47,batt:90,sig:4,last:'Fan 2 louder than usual',sound:'Bearing noise suspected',ev:[['08:05','warn','Unusual fan sound','Deviation 47 %, rising over 3 days'],['Mon','ok','Service visit','Normal state kept']]},
  {id:'pump',name:'Pump room',kind:'water',status:'ok',temp:16.8,target:'Info',hum:52,dev:11,batt:89,sig:3,last:'Pumps cycling normally',sound:'Pump cycles as usual',ev:[['06:00','ok','Daily check','All normal']]}]}
];
const all=()=>SITES.flatMap(s=>s.rooms.map(r=>({s,r})));
const rank={alert:2,warn:1,ok:0};
const siteStatus=s=>s.rooms.reduce((a,r)=>rank[r.status]>rank[a]?r.status:a,'ok');
const label={ok:'Normal',warn:'Warning',alert:'Alarm'};
function series(r,kind){let seed=[...(r.id+kind)].reduce((a,c)=>a+c.charCodeAt(0),0);const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};const out=[];
 for(let i=0;i<48;i++){let v;const late=i>=38;
  if(kind==='dev'){v=r.status==='alert'?(late?Math.min(100,60+(i-38)*5):6+rnd()*6):r.status==='warn'?(i>30?20+(i-30)*1.8:5+rnd()*6):4+rnd()*8}
  else{const base=r.kind==='freezer'?-19:r.kind==='cold'?3.5:r.temp;v=r.status==='alert'?(late?base+(i-38)*0.75:base+rnd()*0.6):base+Math.sin(i/4)*0.4+rnd()*0.3}
  out.push(v)}return out}
function sparkSVG(r){const d=series(r,'dev');const max=100;return `<svg class="spark" viewBox="0 0 64 26"><polyline fill="none" stroke="${C[r.status]}" stroke-width="2" points="${d.map((v,i)=>`${(i/47*64).toFixed(1)},${(24-v/max*22).toFixed(1)}`).join(' ')}"/></svg>`}
function render(){
 const rs=all(),alerts=rs.filter(x=>x.r.status==='alert'),warns=rs.filter(x=>x.r.status==='warn');
 document.getElementById('today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+' · '+SITES.length+' sites monitored';
 document.getElementById('kpis').innerHTML=[['Sites',SITES.length,''],['Rooms',rs.length,''],['Active alarms',alerts.length,'a'],['Warnings',warns.length,'w'],['Avg battery',Math.round(rs.reduce((a,x)=>a+x.r.batt,0)/rs.length)+' %','']].map(([t,v,c])=>`<div class="kpi ${c}"><span>${t}</span><b>${v}</b></div>`).join('');
 document.getElementById('navAlerts').textContent=alerts.length;
 const b=document.getElementById('banner');if(alerts.length){const a=alerts[0];b.style.display='';document.getElementById('bTitle').textContent=`${a.r.name}, ${a.s.name}: ${a.r.last}`;document.getElementById('bText').textContent=`Temperature ${fmtT(a.r.temp)} and rising. Alarm sent 03:14 to Anna Berg and the duty phone.`}else b.style.display='none';
 const iss=rs.filter(x=>x.r.status!=='ok').sort((p,q)=>rank[q.r.status]-rank[p.r.status]);
 document.getElementById('attn').innerHTML=iss.map(x=>`<div class="at" style="--c:${C[x.r.status]}" onclick="openD('${x.s.id}','${x.r.id}')"><div class="ai">${{alert:'🚨',warn:'⚠️'}[x.r.status]}</div><div><b>${x.r.name} · ${x.s.name}</b><span>${x.r.last}</span><small>${label[x.r.status]} · deviation ${x.r.dev} %</small></div></div>`).join('')||'<p style="color:var(--muted)">All rooms are normal.</p>';
 const evs=rs.flatMap(x=>x.r.ev.slice(0,2).map(e=>({e,x}))).filter(o=>/^\d/.test(o.e[0])).sort((p,q)=>q.e[0].localeCompare(p.e[0])).slice(0,6);
 document.getElementById('recent').innerHTML=evs.map(o=>`<div class="ev" style="--c:${C[o.e[1]]}"><time>${o.e[0]}</time><i></i><div><b>${o.e[2]}</b><span>${o.x.r.name}, ${o.x.s.name}</span></div></div>`).join('');
 renderSites()}
let filt='all';
function renderSites(){document.getElementById('sites').innerHTML=SITES.filter(s=>filt==='all'||filt==='issues'?true:s.type===filt).map(s=>{
 const rooms=s.rooms.filter(r=>filt!=='issues'||r.status!=='ok');if(!rooms.length)return '';const st=siteStatus(s);
 return `<div class="site" id="site-${s.id}"><div class="sh"><div class="ic">${s.ic}</div><div><b>${s.name}</b><small>${s.place} · ${s.rooms.length} rooms</small></div><span class="st ${st}">${label[st]}</span></div>
 ${rooms.map(r=>`<div class="room" onclick="openD('${s.id}','${r.id}')"><div class="rn"><span class="dot" style="--c:${C[r.status]}"></span><div style="min-width:0"><b>${r.name}</b><small>${r.last}</small></div></div><div class="v">${fmtT(r.temp)}<small>${r.hum} % RH</small></div><div class="v">${r.dev} %<small>deviation</small></div>${sparkSVG(r)}</div>`).join('')}</div>`}).join('')}
document.querySelectorAll('#filter button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filter button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filt=b.dataset.f;renderSites()});
const fmtT=t=>(t<0?'−':'')+Math.abs(t).toFixed(1)+' °C';
function chartSVG(r,kind){const d=series(r,kind);const lo=Math.min(...d),hi=Math.max(...d);const pad=(hi-lo)*.15||1;const mn=kind==='dev'?0:lo-pad,mx=kind==='dev'?100:hi+pad;
 const W=560,H=170,pts=d.map((v,i)=>[i/47*W,H-8-(v-mn)/(mx-mn)*(H-16)]);const line=pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
 let ref='';if(kind==='dev'){const y=H-8-(45-mn)/(mx-mn)*(H-16);ref=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#121212" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-4}" y="${y-6}" text-anchor="end" font-size="11" fill="#6B665D" font-family="Geist,Arial">Alarm limit 45 %</text>`}
 if(kind==='temp'&&r.kind==='freezer'){const y=H-8-(-18-mn)/(mx-mn)*(H-16);ref=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#121212" stroke-dasharray="4 4" stroke-width="1"/><text x="4" y="${y-6}" font-size="11" fill="#6B665D" font-family="Geist,Arial">Limit −18 °C</text>`}
 const col=C[r.status];return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="g${kind}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".25"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${ref}<polygon points="0,${H} ${line} ${W},${H}" fill="url(#g${kind})"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.5"/><circle cx="${pts[47][0]-3}" cy="${pts[47][1]}" r="4" fill="${col}"/></svg>`}
let curR=null;
function openD(sid,rid){const s=SITES.find(x=>x.id===sid),r=s.rooms.find(x=>x.id===rid);curR={s,r};const st=r.status;
 const vic={alert:'🚨',warn:'⚠️',ok:'✅'}[st];
 document.getElementById('drawer').innerHTML=`<div class="dh"><button class="x" onclick="closeD()" aria-label="Close">×</button><small>${s.name} · ${s.place}</small><h3>${r.name}</h3><span class="st ${st}">${label[st]}</span></div>
 <div class="verdict" style="--c:${C[st]}"><div class="vi">${vic}</div><div><b>${r.last}</b><p>${r.sound}</p></div></div>
 <div class="dbody">
 <div class="mets"><div class="met"><span>Temperature</span><b>${fmtT(r.temp)}</b><span>${r.target}</span></div><div class="met"><span>Humidity</span><b>${r.hum} %</b><span>${r.hum>75?'High':'Normal'}</span></div><div class="met"><span>Deviation</span><b style="color:${C[st]}">${r.dev} %</b><span>from normal</span></div><div class="met"><span>Battery · signal</span><b>${r.batt} %</b><span>LTE‑M ${'▮'.repeat(r.sig)}${'▯'.repeat(4-r.sig)}</span></div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="eyebrow">Last 24 hours</span><div class="tabs"><button class="on" data-k="dev">Deviation</button><button data-k="temp">Temperature</button></div></div><div id="chartBox">${chartSVG(r,'dev')}</div><div class="axis"><span>24 h ago</span><span>12 h</span><span>Now</span></div></div>
 <div class="card"><span class="eyebrow">Event log</span><div class="tl" style="margin-top:8px">${r.ev.map(e=>`<div class="ev" style="--c:${C[e[1]]}"><time>${e[0]}</time><i></i><div><b>${e[2]}</b><span>${e[3]}</span></div></div>`).join('')}</div></div>
 <div class="card baseline"><span style="font-size:22px">📚</span><div><b>Normal state</b> learned 12 Nov, 10 minutes at 22:00. Updated automatically each week. No audio is stored.</div></div>
 <div class="acts">${st!=='ok'?`<button class="btn p" onclick="ack()">Acknowledge</button><button class="btn" onclick="toast('Neighbour Erik notified by SMS')">Notify contact</button><button class="btn d" onclick="toast('Event log shared with your insurer')">Share with insurer</button>`:`<button class="btn" onclick="toast('Learning a new normal state for 10 minutes')">Relearn normal state</button><button class="btn" onclick="toast('Report downloaded')">Download report</button>`}</div>
 </div>`;
 document.querySelectorAll('#drawer .tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#drawer .tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('chartBox').innerHTML=chartSVG(r,b.dataset.k)});
 document.getElementById('drawer').classList.add('on');document.getElementById('scrim').classList.add('on');document.getElementById('drawer').setAttribute('aria-hidden','false')}
function closeD(){document.getElementById('drawer').classList.remove('on');document.getElementById('scrim').classList.remove('on');document.getElementById('drawer').setAttribute('aria-hidden','true')}
function ack(){if(!curR)return;curR.r.status='warn';curR.r.last='Acknowledged by Anna; technician on the way';curR.r.ev.unshift([new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),'warn','Acknowledged','By Anna Berg; technician booked']);render();openD(curR.s.id,curR.r.id);toast('Alarm acknowledged')}
function openFirstAlert(){const a=all().find(x=>x.r.status==='alert')||all().find(x=>x.r.status==='warn');if(a)openD(a.s.id,a.r.id)}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
render();
</script>
</body>
</html>
